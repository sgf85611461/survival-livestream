<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>末日避难所 - 直播控制台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    padding: 10px;
    margin: 0;
    height: 100vh;
    overflow: hidden;
}
.container { max-width: 100%; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 100vh; overflow: hidden; }
.game-col { height: 100vh; }
.game-col iframe { width: 100%; height: calc(100vh - 40px); border: none; border-radius: 10px; background: #000; }
.controls-col { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding-right: 5px; }
h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 24px;
    background: linear-gradient(90deg, #f97316, #ef4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 18px;
}
.card h2 {
    font-size: 15px;
    color: #58a6ff;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #30363d;
}
.field { margin-bottom: 12px; }
.field label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 4px;
    color: #8b949e;
}
.field label span { color: #f97316; font-weight: 600; }
input[type=range] {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    background: #30363d;
    border-radius: 2px;
    outline: none;
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: #f97316;
    border-radius: 50%;
    cursor: pointer;
}
input[type=text] {
    width: 100%;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 10px;
    color: #c9d1d9;
    font-size: 13px;
}
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat {
    background: #0d1117;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
}
.stat .num { font-size: 24px; font-weight: 700; color: #f97316; }
.stat .lbl { font-size: 11px; color: #8b949e; margin-top: 4px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
}
button:hover { opacity: .85; }
.btn-start { background: #238636; color: #fff; }
.btn-stop { background: #da3633; color: #fff; }
.btn-neutral { background: #30363d; color: #c9d1d9; }
.tts-input { width:100%; background:#0d1117; border:1px solid #30363d; color:#c9d1d9; border-radius:4px; padding:4px; font-size:11px; box-sizing:border-box; }
.btn-warn { background: #d29922; color: #000; }
.log {
    background: #0d1117;
    border-radius: 6px;
    padding: 10px;
    height: 150px;
    overflow-y: auto;
    font-size: 11px;
    font-family: monospace;
    color: #8b949e;
}
.log div { margin-bottom: 3px; }
.badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
}
.badge-live { background: #da3633; color: #fff; }
.badge-idle { background: #30363d; color: #8b949e; }
.full { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="container">
    <div class="game-col">
        <iframe id="gameFrame" src="http://localhost:7456" allow="autoplay; microphone"></iframe>
    </div>
    <div class="controls-col">

        <!-- 直播间信息 -->
        <div class="card">
            <h2>直播间信息 <span class="badge badge-idle" id="statusBadge">未开始</span></h2>
            <div class="field">
                <label>房间号</label>
                <input type="text" id="roomId" placeholder="输入抖音房间号">
            </div>
            <div class="field">
                <label>直播间</label>
                <div style="display:flex;gap:8px;">
                    <button onclick="openLive()" style="background:#e91e63;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;white-space:nowrap;">打开直播间</button>
                    <button onclick="startDanmaku()" style="background:#2196F3;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;white-space:nowrap;">启动弹幕捕获</button>
                </div>
            </div>
            <div class="field">
                <label>在线观众 <span id="viewerCount">50</span></label>
                <input type="range" min="0" max="500" value="50" id="viewerSlider">
            </div>
        </div>

        <!-- 游戏统计 -->
        <div class="card">
            <h2>实时数据</h2>
            <div class="stats">
                <div class="stat"><div class="num" id="statKills">0</div><div class="lbl">击杀数</div></div>
                <div class="stat"><div class="num" id="statMissed">0</div><div class="lbl">漏怪数</div></div>
                <div class="stat"><div class="num" id="statTime">0:00</div><div class="lbl">游戏时长</div></div>
                <div class="stat"><div class="num" id="statGifts">0</div><div class="lbl">礼物触发</div></div>
            </div>
        </div>

        <!-- 游戏控制 -->
        <div class="card">
            <h2>游戏控制</h2>
            <div class="btn-row" style="margin-bottom:8px">
                <button class="btn-start" onclick="action('start')">开始游戏</button>
                <button class="btn-stop" onclick="action('stop')">停止</button>
            </div>
            <div class="btn-row" style="margin-bottom:8px">
                <button class="btn-neutral" onclick="action('boss')">刷Boss</button>
                <button class="btn-neutral" onclick="action('heal')">墙+50血</button>
            </div>
            <div class="field">
                <label>场景模式</label>
                <div class="btn-row">
                    <button class="btn-neutral" onclick="sceneMode('day')">白天</button>
                    <button class="btn-neutral" onclick="sceneMode('rain')">雨天</button>
                    <button class="btn-neutral" onclick="sceneMode('night')">夜晚</button>
                    <button class="btn-warn" onclick="sceneMode('indoor')">暖光</button>
                </div>
            </div>
        </div>

        <!-- 刷怪参数 -->
        <div class="card">
            <h2>刷怪参数</h2>
            <div class="field">
                <label>刷怪间隔 <span id="spawnIntervalVal">1.0s</span></label>
                <input type="range" min="0.3" max="5" step="0.1" value="1.0" id="spawnInterval">
            </div>
            <div class="field">
                <label>小怪血量 <span id="smallHpVal">13</span></label>
                <input type="range" min="5" max="50" value="13" id="smallHp">
            </div>
            <div class="field">
                <label>人形怪血量 <span id="humanHpVal">33</span></label>
                <input type="range" min="10" max="100" value="33" id="humanHp">
            </div>
            <div class="field">
                <label>Boss血量 <span id="bossHpVal">67</span></label>
                <input type="range" min="30" max="200" value="67" id="bossHp">
            </div>
            <div class="field">
                <label>怪速度 <span id="speedVal">5.0</span></label>
                <input type="range" min="2" max="10" step="0.5" value="5" id="speed">
            </div>
        </div>

        <!-- 防御参数 -->
        <div class="card">
            <h2>防御参数</h2>
            <div class="field">
                <label>墙血量 <span id="wallHpVal">30</span></label>
                <input type="range" min="10" max="300" value="30" id="wallHp">
            </div>
            <div class="field">
                <label>箭塔伤害 <span id="arrowDmgVal">2</span></label>
                <input type="range" min="1" max="20" value="2" id="arrowDmg">
            </div>
            <div class="field">
                <label>箭塔射速 <span id="arrowRateVal">1.5s</span></label>
                <input type="range" min="0.3" max="5" step="0.1" value="1.5" id="arrowRate">
            </div>
        </div>

        <!-- 语音播报 -->
        <div class="card">
            <h2>语音播报</h2>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                <label style="font-size:13px;">开关</label>
                <input type="checkbox" id="ttsEnabled" checked onchange="saveTts()" style="width:18px;height:18px;">
                <label style="font-size:13px;">语音</label>
                <select id="ttsVoice" onchange="saveTts()" style="background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:2px;font-size:12px;">
                    <option value="xiaoxiao">普通话(晓晓)</option>
                    <option value="xiaobei">东北话(晓北)</option>
                    <option value="xiaoni">陕西话(晓妮)</option>
                </select>
                <label style="font-size:13px;">音量</label>
                <input type="range" id="ttsVol" min="0" max="100" value="100" onchange="saveTts()" style="flex:1;">
                <label style="font-size:13px;">语速</label>
                <input type="range" id="ttsRate" min="-5" max="10" value="2" onchange="saveTts()" style="width:60px;">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;">
                <div><label style="font-size:11px;color:#888;">进房欢迎</label><input id="tts_welcome" class="tts-input"></div>
                <div><label style="font-size:11px;color:#888;">建塔</label><input id="tts_buildTower" class="tts-input"></div>
                <div><label style="font-size:11px;color:#888;">砖墙升级</label><input id="tts_brickWall" class="tts-input"></div>
                <div><label style="font-size:11px;color:#888;">城墙升级</label><input id="tts_stoneWall" class="tts-input"></div>
                <div><label style="font-size:11px;color:#888;">关注</label><input id="tts_follow" class="tts-input"></div>
                <div><label style="font-size:11px;color:#888;">送礼</label><input id="tts_gift" class="tts-input"></div>
                <div><label style="font-size:11px;color:#888;">墙危急</label><input id="tts_lowWall" class="tts-input"></div>
                <div><label style="font-size:11px;color:#888;">Boss</label><input id="tts_boss" class="tts-input"></div>
            </div>
            <div style="border-top:1px solid #30363d;margin:8px 0;padding-top:8px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                    <label style="font-size:12px;color:#888;">日常播报间隔(秒)</label>
                    <input type="number" id="ttsInterval" value="60" min="10" max="300" onchange="saveTts()" style="width:60px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:3px;font-size:12px;">
                </div>
                <div id="timedTipsList" style="display:flex;flex-direction:column;gap:4px;margin-bottom:6px;"></div>
                <button class="btn-neutral" style="width:100%;font-size:11px;padding:4px;margin-bottom:6px;" onclick="addTimedTip()">+ 加一条话术</button>
            </div>
            <div style="display:flex;gap:6px;">
                <button class="btn-neutral" style="flex:1;font-size:11px;padding:6px;" onclick="testTts()">试听事件</button>
                <button class="btn-neutral" style="flex:1;font-size:11px;padding:6px;" onclick="testTimedTip()">立即播报日常</button>
                <button class="btn-start" style="flex:1;font-size:11px;padding:6px;" onclick="saveTts()">保存话术</button>
            </div>
        </div>

        <!-- 话术提示 -->
        <div class="card">
            <h2>话术提示</h2>
            <div id="scriptTip" style="background:#0d1117;border-radius:8px;padding:15px;font-size:16px;color:#f97316;font-weight:600;line-height:1.5;min-height:50px;">
                欢迎来到末日避难所！点关注加入防线，送礼召唤Boss！
            </div>
            <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn-neutral" style="flex:1;font-size:11px;padding:6px;" onclick="showTip('欢迎新进来的家人们！点关注生存者就帮你打丧尸！')">欢迎话术</button>
                <button class="btn-neutral" style="flex:1;font-size:11px;padding:6px;" onclick="showTip('墙快破了！快送礼物帮我回血守家！')">求救话术</button>
                <button class="btn-neutral" style="flex:1;font-size:11px;padding:6px;" onclick="showTip('Boss来了！所有人集火！')">Boss话术</button>
            </div>
        </div>

        <!-- 弹幕模拟 -->
        <div class="card">
            <h2>直播间弹幕</h2>
            <div class="log" id="liveChat" style="height:120px;margin-bottom:10px;">
                <div>等待弹幕...</div>
            </div>
            <div style="display:flex;gap:6px;margin-bottom:10px;">
                <input type="text" id="danmakuInput" placeholder="输入弹幕内容，如：修墙！" style="flex:1;" onkeydown="if(event.key==='Enter')sendDanmaku()">
                <button class="btn-start" style="flex:0 0 60px;padding:8px;" onclick="sendDanmaku()">发送</button>
            </div>
            <div class="btn-row" style="margin-bottom:8px;">
                <button class="btn-neutral" style="font-size:11px;padding:6px;" onclick="quickDanmaku('修墙！')">修墙</button>
                <button class="btn-neutral" style="font-size:11px;padding:6px;" onclick="quickDanmaku('加速！')">加速</button>
                <button class="btn-neutral" style="font-size:11px;padding:6px;" onclick="quickDanmaku('建塔！')">建塔</button>
                <button class="btn-neutral" style="font-size:11px;padding:6px;" onclick="quickDanmaku('666')">666</button>
            </div>
            <div class="btn-row">
                <button class="btn-warn" style="font-size:12px;padding:8px;" onclick="simulateGift()">模拟送礼</button>
                <button class="btn-neutral" style="font-size:12px;padding:8px;" onclick="simulateJoin()">观众进房</button>
                <button class="btn-start" style="font-size:12px;padding:8px;" onclick="simulateFollow()">模拟关注</button>
            </div>
            <div class="btn-row">
                <button style="font-size:14px;padding:10px;background:#e91e63;color:#fff;font-weight:bold;" onclick="sendLike(1)">❤️ 点赞</button>
            </div>
        </div>

        <!-- 事件日志 -->
        <div class="card">
            <h2>事件日志</h2>
            <div class="log" id="eventLog">
                <div>系统就绪，等待连接...</div>
            </div>
        </div>

    </div>
</div>
<script>
// 自动聚焦iframe让游戏接收键盘
window.addEventListener('load', () => {
    setTimeout(() => { document.getElementById('gameFrame').focus(); }, 1000);
});
// 点击游戏区域时聚焦
document.querySelector('.game-col').addEventListener('click', () => {
    document.getElementById('gameFrame').focus();
});

let ws = null;
function connect() {
    ws = new WebSocket('ws://localhost:8080');
    ws.onopen = () => {
        ws.send(JSON.stringify({type:'panel'}));
        log('已连接游戏服务器');
        document.getElementById('statusBadge').textContent = '已连接';
        document.getElementById('statusBadge').className = 'badge badge-live';
    };
    ws.onmessage = (e) => {
        if (e.data instanceof Blob) {
            e.data.text().then(text => handleMsg(text));
            return;
        }
        handleMsg(e.data);
    };
    function handleMsg(data) {
        try {
            const msg = JSON.parse(data);
            if (msg.type === 'stats') {
                document.getElementById('statKills').textContent = msg.kills || 0;
                document.getElementById('statMissed').textContent = msg.missed || 0;
                document.getElementById('statTime').textContent = msg.time || '0:00';
                document.getElementById('statGifts').textContent = msg.gifts || 0;
                document.getElementById('viewerCount').textContent = msg.viewers || 0;
                if (msg.wallHp !== undefined) {
                    document.getElementById('wallHpVal').textContent = msg.wallHp;
                    if (msg.wallHp <= 10) showTip('警告！墙快破了！快送礼物回血！');
                }
            } else if (msg.type === 'danmaku') {
                addChat(msg.user || '观众', msg.text || '');
            } else if (msg.type === 'simulateGift') {
                addChat(msg.user || '观众', '送了礼物！', '#f97316');
            } else if (msg.type === 'viewerJoin') {
                addChat('系统', '有观众进入直播间', '#58a6ff');
            } else if (msg.type === 'follow') {
                addChat(msg.user || '观众', '关注了主播', '#238636');
            }
        } catch(e) {}
    };
    ws.onclose = () => {
        log('断开，3秒后重连...');
        document.getElementById('statusBadge').textContent = '未连接';
        document.getElementById('statusBadge').className = 'badge badge-idle';
        setTimeout(connect, 3000);
    };
}
connect();

function send(obj) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

const sliders = ['spawnInterval','smallHp','humanHp','bossHp','speed','wallHp','arrowDmg','arrowRate','viewerSlider'];
sliders.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.oninput = () => {
        const lbl = document.getElementById(id + 'Val') || document.getElementById('viewerCount');
        if (lbl) lbl.textContent = el.value;
        send({type:'param', key:id, value:parseFloat(el.value)});
    };
});
function action(a) { send({type:'action', cmd:a}); log('操作: ' + a); }
function sceneMode(m) { send({type:'scene', mode:m}); log('切换场景: ' + m); }
function showTip(text) {
    document.getElementById('scriptTip').textContent = text;
}

// TTS
let _timedTips = [];
function renderTimedTips() {
    const box = document.getElementById('timedTipsList');
    box.innerHTML = '';
    _timedTips.forEach((t, i) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:4px;';
        row.innerHTML = `<input class="tts-input" value="${t.replace(/"/g,'&quot;')}" onchange="_timedTips[${i}]=this.value;saveTts()">
            <button class="btn-neutral" style="font-size:10px;padding:2px 6px;" onclick="_timedTips.splice(${i},1);renderTimedTips();saveTts()">x</button>`;
        box.appendChild(row);
    });
}
function addTimedTip() { _timedTips.push('新话术'); renderTimedTips(); saveTts(); }
async function loadTts() {
    try {
        const r = await fetch('http://localhost:8090/tts_config');
        const c = await r.json();
        document.getElementById('ttsEnabled').checked = c.enabled !== false;
        document.getElementById('ttsVoice').value = c.voice || 'xiaoxiao';
        document.getElementById('ttsVol').value = c.volume || 100;
        document.getElementById('ttsRate').value = c.rate != null ? c.rate : 2;
        document.getElementById('ttsInterval').value = c.timedInterval || 60;
        _timedTips = c.timedTips || [];
        renderTimedTips();
        for (const k of ['welcome','buildTower','brickWall','stoneWall','follow','gift','lowWall','boss']) {
            const el = document.getElementById('tts_' + k);
            if (el) el.value = c[k] || '';
        }
    } catch(e) { console.log('TTS config not loaded:', e); }
}
async function saveTts() {
    const data = {
        enabled: document.getElementById('ttsEnabled').checked,
        voice: document.getElementById('ttsVoice').value,
        volume: parseInt(document.getElementById('ttsVol').value),
        rate: parseInt(document.getElementById('ttsRate').value),
        welcome: document.getElementById('tts_welcome').value,
        buildTower: document.getElementById('tts_buildTower').value,
        brickWall: document.getElementById('tts_brickWall').value,
        stoneWall: document.getElementById('tts_stoneWall').value,
        follow: document.getElementById('tts_follow').value,
        gift: document.getElementById('tts_gift').value,
        lowWall: document.getElementById('tts_lowWall').value,
        boss: document.getElementById('tts_boss').value,
        timedTips: _timedTips,
        timedInterval: parseInt(document.getElementById('ttsInterval').value) || 60,
        lowWallThreshold: 30
    };
    await fetch('http://localhost:8090/tts_config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
    log('语音配置已保存');
}
async function testTts() {
    await fetch('http://localhost:8090/tts_speak', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:'语音测试，末日避难所系统正常'})});
}
async function testTimedTip() {
    if (_timedTips.length === 0) return;
    const t = _timedTips[Math.floor(Math.random()*_timedTips.length)];
    await fetch('http://localhost:8090/tts_speak', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:t})});
}
loadTts();
function sendDanmaku() {
    const inp = document.getElementById('danmakuInput');
    const text = inp.value.trim();
    if (!text) return;
    const users = ['小明','阿伟','直播间老铁','路人甲','土豪玩家'];
    const user = users[Math.floor(Math.random()*users.length)];
    send({type:'danmaku', text:text, user:user});
    addDanmakuLog(user, text);
    inp.value = '';
}
function quickDanmaku(text) {
    send({type:'danmaku', text:text, user:'快速测试'});
    addDanmakuLog('快速测试', text);
}
function simulateGift() {
    const gifters = ['小明','阿伟','土豪玩家','路人甲'];
    const user = gifters[Math.floor(Math.random()*gifters.length)];
    send({type:'simulateGift', user:user});
    addDanmakuLog(user, '送了礼物！');
    log('模拟送礼: ' + user);
}
function simulateJoin() {
    send({type:'viewerJoin'});
    addDanmakuLog('新观众', '进入直播间');
    log('模拟观众进房');
}
function simulateFollow() {
    const users = ['小明','阿伟','土豪玩家','路人甲'];
    const user = users[Math.floor(Math.random()*users.length)];
    send({type:'follow', user:user});
    addDanmakuLog(user, '关注了主播');
    log('模拟关注: ' + user);
}
function openLive() {
    const rid = document.getElementById('roomId').value.trim() || '996594434954';
    fetch(`http://localhost:8080/open-live?rid=${rid}`);
    log('打开CDP浏览器直播间: ' + rid);
}
function startDanmaku() {
    const rid = document.getElementById('roomId').value.trim() || '996594434954';
    fetch(`http://localhost:8080/start-danmaku?rid=${rid}`);
    log('启动弹幕捕获脚本: ' + rid);
}
function sendLike(n) {
    send({type:'like', count:n});
    log('点赞 +' + n);
}
function addDanmakuLog(user, text) {
    const log = document.getElementById('liveChat');
    if (log.querySelector('div') && log.children.length === 1 && log.children[0].textContent === '等待弹幕...') {
        log.innerHTML = '';
    }
    const d = document.createElement('div');
    d.style.color = '#f97316';
    d.textContent = user + ': ' + text;
    log.prepend(d);
    while (log.children.length > 20) log.removeChild(log.lastChild);
}
function addChat(user, text, color) {
    const log = document.getElementById('liveChat');
    if (log.querySelector('div') && log.children.length === 1 && log.children[0].textContent === '等待弹幕...') {
        log.innerHTML = '';
    }
    const d = document.createElement('div');
    d.style.color = color || '#c9d1d9';
    d.innerHTML = '<b style="color:#58a6ff">[' + user + ']</b> ' + text;
    log.prepend(d);
    while (log.children.length > 30) log.removeChild(log.lastChild);
}
function log(msg) {
    const d = document.createElement('div');
    d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    document.getElementById('eventLog').prepend(d);
}
</script>
</body>
